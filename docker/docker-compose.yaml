services:
  n8n-main:
    image: ${N8N_IMAGE:-n8nio/n8n:latest}
    container_name: n8n-main
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file: 
      - .env.main-only
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - n8n-network
    profiles:
      - "n8n"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
  
  n8n-worker:
    image: ${N8N_IMAGE:-n8nio/n8n:latest}
    container_name: n8n-worker
    restart: unless-stopped
    command: worker
    env_file: 
      - .env
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - n8n-network
    profiles:
      - "n8n"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n-main:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 45s
      timeout: 10s
      retries: 3
      start_period: 45s
  
  task-runners:
    image: ${N8N_RUNNERS_IMAGE:-n8nio/runners:latest}
    container_name: n8n-runners
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./n8n/n8n-task-runners.json:/etc/n8n-task-runners.json:ro
    networks:
      - n8n-network
    profiles:
      - "n8n"
    depends_on:
      n8n-main:
        condition: service_healthy
      n8n-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5680/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15}
    container_name: postgres
    restart: unless-stopped
    command: > 
      postgres 
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/server.crt 
        -c ssl_key_file=/var/lib/postgresql/server.key
    env_file:
      - .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/server.crt:/var/lib/postgresql/server.crt:ro
      - ./postgres/server.key:/var/lib/postgresql/server.key:ro
      #- ./logs/wal:/var/lib/postgresql/wal
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESDB_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: redis
    restart: unless-stopped
    command: > 
      redis-server 
        --requirepass ${REDIS_PASSWORD} 
        --protected-mode no 
        --appendonly yes 
        --appendfsync everysec 
        --save 900 1
        --save 300 10
        --save 60 10000
        --maxmemory 512mb 
        --maxmemory-policy allkeys-lru
    env_file:
      - .env
    volumes:
      - ./data/redis:/data
    networks:
      - n8n-network
    healthcheck: 
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"] 
      interval: 10s 
      timeout: 5s 
      retries: 5
      start_period: 15s

networks:
  n8n-network:
    driver: bridge
    name: n8n-network
