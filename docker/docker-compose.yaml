services:
  n8n-main:
    image: ${N8N_IMAGE:-n8nio/n8n:latest}
    container_name: n8n-main
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file: 
      - ./n8n/.env.n8n
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - n8n-network
    profiles:
      - "n8n"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
  
  n8n-worker:
    image: ${N8N_IMAGE:-n8nio/n8n:latest}
    container_name: n8n-worker
    restart: unless-stopped
    command: worker
    env_file: 
      - ./n8n/.env.n8n
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - n8n-network
    profiles:
      - "n8n"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n-main:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 45s
      timeout: 10s
      retries: 3
      start_period: 45s
  
  task-runners:
    image: ${N8N_RUNNERS_IMAGE:-n8nio/runners:latest}
    container_name: n8n-runners
    restart: unless-stopped
    env_file:
      - ./n8n/.env.runners
    volumes:
      - ./n8n/n8n-task-runners.json:/etc/n8n-task-runners.json:ro
    networks:
      - n8n-network
    profiles:
      - "n8n"
    depends_on:
      n8n-main:
        condition: service_healthy
      n8n-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5680/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15}
    container_name: postgres
    restart: unless-stopped
    command: > 
      postgres 
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/server.crt 
        -c ssl_key_file=/var/lib/postgresql/server.key
    env_file:
      - ./postgres/.env.postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/server.crt:/var/lib/postgresql/server.crt:ro
      - ./postgres/server.key:/var/lib/postgresql/server.key:ro
      #- ./logs/wal:/var/lib/postgresql/wal
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESDB_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: redis
    restart: unless-stopped
    command: > 
      redis-server 
        --requirepass ${REDIS_PASSWORD} 
        --protected-mode no 
        --appendonly yes 
        --appendfsync everysec 
        --save 900 1
        --save 300 10
        --save 60 10000
        --maxmemory 512mb 
        --maxmemory-policy allkeys-lru
    env_file:
      - ./redis/.env.redis
    volumes:
      - ./data/redis:/data
    networks:
      - n8n-network
    healthcheck: 
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"] 
      interval: 10s 
      timeout: 5s 
      retries: 5
      start_period: 15s

  scrapling:  
    image: ${SCRAPLING_IMAGE:-pyd4vinci/scrapling:latest}  
    container_name: scrapling
    restart: unless-stopped  
    command: ["mcp", "--http", "--host", "0.0.0.0", "--port", "8000"]  
    ports:  
      - "8000:8000"
    shm_size: "2gb"  
    networks: 
      - n8n_network
    profiles:
      - "scraper"

  tailscale:  
    image: ${TRANSLATE_IMAGE:-tailscale/tailscale:latest}  
    container_name: tailscale  
    hostname: ${TS_HOSTNAME:-my-tailscale-node}  
    restart: unless-stopped
    cap_add:  
      - NET_ADMIN  
      - NET_RAW  
    devices:  
      - /dev/net/tun:/dev/net/tun
    sysctls:  
      - net.ipv4.ip_forward=1  
      - net.ipv6.conf.all.forwarding=1 
    env_file:
      - ./tailscale/.env.tailscale
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./tailscale/config:/config:ro
    healthcheck:  
      test: ["CMD", "wget", "-qO-", "http://localhost:9002/healthz"]  
      interval: 30s  
      timeout: 5s  
      retries: 3
  
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}  
    container_name: openclaw-gateway
    restart: unless-stopped
    command:  
      [  
        "node",  "dist/index.js",  "gateway",  
        "--bind",  "${OPENCLAW_GATEWAY_BIND:-lan}",  
        "--port",  "18789",  
      ]
    init: true
    ports:
      - "18789:18789"
    env_file:
      - .env.openclaw
    environment:
      - NODE_ENV=production
      - OPENCLAW_GATEWAY_HOST=0.0.0.0
      - OPENCLAW_GATEWAY_PORT=18789
    volumes:  
      - "${OPENCLAW_CONFIG_DIR:-${HOME:-/tmp}/.openclaw}:/home/node/.openclaw"  
      - "${OPENCLAW_WORKSPACE_DIR:-${HOME:-/tmp}/.openclaw/workspace}:/home/node/.openclaw/workspace"  
      - "${OPENCLAW_AUTH_PROFILE_SECRET_DIR:-${HOME:-/tmp}/.openclaw-auth-profile-secrets}:/home/node/.config/openclaw"
    networks:
      - openclaw-network
    profiles: ["openclaw"]
    healthcheck:
      test: ["CMD", "node", "dist/index.js", "health", "--token", "$${OPENCLAW_GATEWAY_TOKEN:-check}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    cap_drop:  
      - NET_RAW  
      - NET_ADMIN  
    security_opt:  
      - no-new-privileges:true 

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}  
    container_name: openclaw-cli
    entrypoint: ["node", "dist/index.js"]
    stdin_open: true
    tty: true
    init: true
    env_file:
      - .env.openclaw
    environment:
      - NODE_ENV=production
    volumes: 
      - "${OPENCLAW_CONFIG_DIR:-${HOME:-/tmp}/.openclaw}:/home/node/.openclaw"  
      - "${OPENCLAW_WORKSPACE_DIR:-${HOME:-/tmp}/.openclaw/workspace}:/home/node/.openclaw/workspace"  
      - "${OPENCLAW_AUTH_PROFILE_SECRET_DIR:-${HOME:-/tmp}/.openclaw-auth-profile-secrets}:/home/node/.config/openclaw"
    network_mode: "service:openclaw-gateway"
    profiles: ["openclaw"]
    depends_on:  
      - openclaw-gateway
    cap_drop:  
      - NET_RAW  
      - NET_ADMIN  
    security_opt:  
      - no-new-privileges:true

networks:
  n8n-network:
    driver: bridge
    name: n8n-network
